apiVersion: apps/v1
kind: Deployment
metadata:
  name: shopper-deployment
spec:
  selector:
    matchLabels:
      app: myapp

  template:
    metadata:
      labels:
        app: myapp
    spec:
      containers:
      - name: shopper
        image: sanixsandel/shopper:1.0.2
        resources:
          limits:
            memory: "128Mi"
            cpu: "500m"
        ports:
        - containerPort: 5555